services:
  cat-health-api:
    container_name: cat-health-api
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data:Z
    env_file:
      - ./.env
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthcheck"]
    #   interval: 30s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 3s
    restart: unless-stopped

volumes:
  data:
    driver: local