services:
  cat-health-api:
    container_name: cat-health-api
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
      network: host
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data:Z
      - ./recordings:/app/recordings:Z
      - ./images:/app/images:Z
    environment:
      - NODE_ENV=production
      # Override SQLite database path
      - SQLITE_PATH=/app/data/database.sqlite
      # Override video recording storage path
      - MEDIA_PATH=/app/data/media
      # Override temporary media storage path
      - MEDIA_TEMP_PATH=/app/data/temp
    restart: unless-stopped
